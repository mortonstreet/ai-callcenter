meta:
  profile_version: "v1"
  profile_name: "default_core_tabs_profile"
  owner: "platform_admin"
  approved_by_admin: false
  applies_to_industries:
    - "hvac"
    - "plumbing"
    - "roofing"
    - "electrical"
    - "fire_safety"
    - "pest_control"
    - "garage_doors"
    - "cleaning_services"

governance:
  owner_editable_fields:
    - "conversation_config.agent.first_message"
    - "conversation_config.tts.voice_id"
    - "conversation_config.tts.stability"
    - "conversation_config.tts.similarity_boost"
    - "conversation_config.tts.speed"
  owner_blocked_tabs:
    - "Workflow"
    - "Branches"
    - "Knowledge Base"
    - "Analysis"
    - "Tools"
    - "Tests"
    - "Widget"
    - "Security"
    - "Advanced"

tabs:
  agent:
    prompt:
      llm: "gpt-4o"
      temperature: 0.7
      max_tokens: 1024
      owner_editable: false
    language: "en"
    greeting:
      owner_editable: true
      max_length: 280
    voice:
      curated_only: true
      owner_editable: true
      ranges:
        stability: [0.55, 0.85]
        similarity_boost: [0.65, 0.9]
        speed: [0.95, 1.08]

  workflow:
    admin_locked: true
    definition_ref: "specs/v1/agent-factory/workflows/common-customer-request-workflow.v1.yaml"
    fallback_behavior: "fallback_general_information"
    max_branch_depth: 4

  branches:
    admin_locked: true
    low_confidence_threshold: 0.65
    escalate_on_low_confidence: true

  knowledge_base:
    admin_locked: true
    firecrawl:
      enabled: true
      max_pages: 200
      default_excludes:
        - "/privacy"
        - "/terms"
        - "/careers"
        - "/wp-admin"
        - "/cart"
        - "/checkout"
    ingest:
      strategy: "urls"
      allow_owner_manual_additions: false

  analysis:
    admin_locked: true
    data_collection:
      schema_owner: "admin"
    evaluation:
      thresholds_owner: "admin"

  tools:
    admin_locked: true
    system_tools:
      - name: "end_call"
        enabled: true
      - name: "transfer_to_number"
        enabled: false
      - name: "language_detection"
        enabled: true
    mcp:
      enabled: true
      endpoint: "https://api.revcenter.ai/mcp/sse"
      approval_policy: "auto_for_safe_tools"
    custom_webhooks:
      allow_owner_create: false

  tests:
    admin_locked: true
    block_activation_on_failures: true
    run_schedule:
      development: "on_change"
      daily: "0 6 * * *"

  widget:
    admin_locked: true
    enabled: false
    mode: "voice"
    allowed_domains: []

  security:
    admin_locked: true
    auth_token_enabled: true
    allowed_origins:
      - "https://app.revcenter.ai"
    webhook_signing_required: true
    secret_rotation_days: 90

  advanced:
    admin_locked: true
    call_limits:
      max_concurrent: 10
      daily_cap: 1000
    conversation:
      max_duration_seconds: 3600
      silence_end_call_timeout: 30
      turn_timeout: 10
      text_only_mode: false
    privacy:
      recording_retention_days: 90
    webhooks:
      post_call_url: "https://api.revcenter.ai/webhooks/elevenlabs/post-call"
      events:
        - "call.ended"
        - "transcript.ready"

