meta:
  workflow_version: "v1"
  industry: "hvac"
  pack_version: "v1.0.0"
  owner: "agent_ops"
  approved_by_admin: false
  references:
    industry_pack_ref: "specs/v1/agent-factory/industry/hvac.md"
    system_prompt_ref: "specs/v1/agent-factory/industry/hvac-system-prompt.v1.md"
    docs_alignment:
      - "https://elevenlabs.io/docs/agents-platform/workflows"
      - "https://elevenlabs.io/docs/agents-platform/tools/server-tools"
      - "https://elevenlabs.io/docs/agents-platform/testing"
      - "https://elevenlabs.io/docs/agents-platform/versioning"

defaults:
  fallback_node: "fallback_general_information"
  escalate_on_low_confidence: true
  low_confidence_threshold: 0.65
  max_hops_before_handoff: 4
  workflow_overrides_supported: true

intents:
  - id: "safety_emergency"
    description: "Life-safety risk such as gas smell, CO alarm, smoke, sparking, or medically vulnerable no-heat/no-cooling."
    entry_node: "triage_safety_emergency"
    fallback_node: "route_live_dispatch"
    escalation_required: true
  - id: "urgent_outage_no_heat_no_cooling"
    description: "Urgent comfort outage with no immediate life-safety indicator."
    entry_node: "triage_urgent_outage"
    fallback_node: "schedule_priority_service"
    escalation_required: true
  - id: "routine_repair_request"
    description: "Standard repair booking request."
    entry_node: "collect_repair_details"
    fallback_node: "schedule_standard_service"
    escalation_required: false
  - id: "maintenance_plan_interest"
    description: "Seasonal tune-up or preventive maintenance request."
    entry_node: "maintenance_discovery"
    fallback_node: "schedule_maintenance_visit"
    escalation_required: false
  - id: "replacement_quote_request"
    description: "System replacement consult and quote request."
    entry_node: "replacement_lead_qualification"
    fallback_node: "schedule_comfort_consultation"
    escalation_required: false
  - id: "indoor_air_quality_request"
    description: "IAQ symptom discussion and consult request."
    entry_node: "iaq_discovery"
    fallback_node: "schedule_iaq_consult"
    escalation_required: false
  - id: "pricing_or_financing_question"
    description: "Pricing, payment plans, or financing inquiry."
    entry_node: "pricing_financing_information"
    fallback_node: "route_to_sales_queue"
    escalation_required: true
  - id: "reschedule_or_cancel"
    description: "Existing appointment change."
    entry_node: "appointment_change_flow"
    fallback_node: "route_dispatch_queue"
    escalation_required: false
  - id: "warranty_or_repeat_issue"
    description: "Warranty concern, repeat issue, or service dispute."
    entry_node: "account_lookup_and_history"
    fallback_node: "route_service_manager"
    escalation_required: true
  - id: "human_agent_request"
    description: "Explicit request for a human."
    entry_node: "human_handoff"
    fallback_node: "human_handoff"
    escalation_required: true
  - id: "out_of_scope_request"
    description: "Unsupported service or request."
    entry_node: "out_of_scope_response"
    fallback_node: "fallback_general_information"
    escalation_required: false

nodes:
  - id: "triage_safety_emergency"
    type: "triage"
    required_fields:
      - "service_address"
      - "callback_phone"
      - "urgency_level"
      - "escalation_reason"
    allowed_tools:
      - "create_task"
    next:
      on_success: "route_live_dispatch"
      on_failure: "route_live_dispatch"

  - id: "route_live_dispatch"
    type: "escalation"
    required_fields:
      - "escalation_reason"
      - "service_address"
      - "callback_phone"
    allowed_tools:
      - "create_task"
    next:
      on_success: "end_call_handoff"
      on_failure: "end_call_handoff"

  - id: "triage_urgent_outage"
    type: "triage"
    required_fields:
      - "service_address"
      - "callback_phone"
      - "urgency_level"
      - "issue_summary"
    allowed_tools:
      - "lookup_customer"
    next:
      on_success: "schedule_priority_service"
      on_failure: "route_dispatch_queue"

  - id: "collect_repair_details"
    type: "discovery"
    required_fields:
      - "service_type"
      - "service_address"
      - "callback_phone"
      - "issue_summary"
    allowed_tools:
      - "lookup_customer"
    next:
      on_success: "schedule_standard_service"
      on_failure: "fallback_general_information"

  - id: "maintenance_discovery"
    type: "discovery"
    required_fields:
      - "service_type"
      - "system_type"
      - "service_address"
      - "callback_phone"
      - "preferred_time_window"
    allowed_tools:
      - "lookup_customer"
    next:
      on_success: "schedule_maintenance_visit"
      on_failure: "schedule_standard_service"

  - id: "replacement_lead_qualification"
    type: "qualification"
    required_fields:
      - "service_address"
      - "callback_phone"
      - "system_age_years"
      - "financing_interest"
    allowed_tools:
      - "lookup_customer"
    next:
      on_success: "schedule_comfort_consultation"
      on_failure: "route_to_sales_queue"

  - id: "iaq_discovery"
    type: "discovery"
    required_fields:
      - "service_address"
      - "callback_phone"
      - "issue_summary"
    allowed_tools:
      - "lookup_customer"
    next:
      on_success: "schedule_iaq_consult"
      on_failure: "schedule_standard_service"

  - id: "pricing_financing_information"
    type: "information"
    required_fields:
      - "service_type"
      - "callback_phone"
      - "service_address"
    allowed_tools:
      - "lookup_customer"
    next:
      on_success: "route_to_sales_queue"
      on_failure: "route_service_manager"

  - id: "schedule_priority_service"
    type: "booking"
    required_fields:
      - "service_type"
      - "service_address"
      - "preferred_time_window"
      - "callback_phone"
    allowed_tools:
      - "book_appointment"
      - "create_task"
    next:
      on_success: "end_call_success"
      on_failure: "route_dispatch_queue"

  - id: "schedule_standard_service"
    type: "booking"
    required_fields:
      - "service_type"
      - "service_address"
      - "preferred_time_window"
      - "callback_phone"
    allowed_tools:
      - "book_appointment"
      - "create_task"
    next:
      on_success: "end_call_success"
      on_failure: "route_dispatch_queue"

  - id: "schedule_maintenance_visit"
    type: "booking"
    required_fields:
      - "service_address"
      - "callback_phone"
      - "preferred_time_window"
      - "service_type"
    allowed_tools:
      - "book_appointment"
      - "create_task"
    next:
      on_success: "end_call_success"
      on_failure: "route_dispatch_queue"

  - id: "schedule_comfort_consultation"
    type: "booking"
    required_fields:
      - "service_address"
      - "callback_phone"
      - "preferred_time_window"
      - "service_type"
    allowed_tools:
      - "book_appointment"
      - "create_task"
    next:
      on_success: "end_call_success"
      on_failure: "route_to_sales_queue"

  - id: "schedule_iaq_consult"
    type: "booking"
    required_fields:
      - "service_address"
      - "callback_phone"
      - "preferred_time_window"
      - "service_type"
    allowed_tools:
      - "book_appointment"
      - "create_task"
    next:
      on_success: "end_call_success"
      on_failure: "route_dispatch_queue"

  - id: "route_to_sales_queue"
    type: "queue"
    required_fields:
      - "service_type"
      - "callback_phone"
    allowed_tools:
      - "create_task"
    next:
      on_success: "end_call_handoff"
      on_failure: "route_service_manager"

  - id: "appointment_change_flow"
    type: "schedule_change"
    required_fields:
      - "callback_phone"
      - "service_address"
    allowed_tools:
      - "lookup_customer"
      - "create_task"
    next:
      on_success: "end_call_success"
      on_failure: "route_dispatch_queue"

  - id: "account_lookup_and_history"
    type: "escalation"
    required_fields:
      - "service_address"
      - "callback_phone"
      - "escalation_reason"
    allowed_tools:
      - "lookup_customer"
      - "create_task"
    next:
      on_success: "route_service_manager"
      on_failure: "route_service_manager"

  - id: "route_service_manager"
    type: "escalation"
    required_fields:
      - "escalation_reason"
      - "callback_phone"
    allowed_tools:
      - "create_task"
    next:
      on_success: "end_call_handoff"
      on_failure: "end_call_handoff"

  - id: "route_dispatch_queue"
    type: "queue"
    required_fields:
      - "escalation_reason"
      - "callback_phone"
    allowed_tools:
      - "create_task"
    next:
      on_success: "end_call_handoff"
      on_failure: "end_call_handoff"

  - id: "human_handoff"
    type: "handoff"
    required_fields:
      - "escalation_reason"
    allowed_tools:
      - "create_task"
    next:
      on_success: "end_call_handoff"
      on_failure: "end_call_handoff"

  - id: "out_of_scope_response"
    type: "fallback"
    required_fields: []
    allowed_tools: []
    next:
      on_success: "end_call_no_action"
      on_failure: "fallback_general_information"

  - id: "fallback_general_information"
    type: "fallback"
    required_fields: []
    allowed_tools: []
    next:
      on_success: "end_call_no_action"
      on_failure: "route_service_manager"

  - id: "end_call_success"
    type: "terminal"
    required_fields: []
    allowed_tools:
      - "end_call"

  - id: "end_call_handoff"
    type: "terminal"
    required_fields: []
    allowed_tools:
      - "transfer_to_number"

  - id: "end_call_no_action"
    type: "terminal"
    required_fields: []
    allowed_tools:
      - "end_call"

tooling:
  built_in_tools:
    - name: "end_call"
      enabled: true
    - name: "language_detection"
      enabled: true
    - name: "transfer_to_number"
      enabled: false
      enabled_when:
        - "explicit_handoff_policy_permits_transfer"
  server_tools:
    default_approval_mode: "manual"
    default_response_timeout_seconds: 9.5
    max_response_timeout_seconds: 20
    definitions:
      - name: "lookup_customer"
        approval_mode: "auto"
      - name: "book_appointment"
        approval_mode: "manual"
      - name: "create_task"
        approval_mode: "manual"

versioning:
  branches_enabled: true
  protected_branch: "main"
  staging_branch: "staging"
  rollback_via_versions_api: true

tests:
  baseline:
    - id: "hvac.intent.safety_emergency"
      expected_node: "triage_safety_emergency"
    - id: "hvac.intent.urgent_outage"
      expected_node: "triage_urgent_outage"
    - id: "hvac.workflow.repair_booking"
      expected_node: "schedule_standard_service"
    - id: "hvac.workflow.maintenance_booking"
      expected_node: "schedule_maintenance_visit"
    - id: "hvac.workflow.replacement_qualification"
      expected_node: "schedule_comfort_consultation"
    - id: "hvac.escalation.human_handoff"
      expected_node: "human_handoff"
    - id: "hvac.negative.no_unsafe_advice"
      expected_node: "route_live_dispatch"
  daily_regression_enabled: true
