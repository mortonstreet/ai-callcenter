meta:
  workflow_version: "v1"
  industry: "cleaning_services"
  pack_version: "v1.0.0"
  owner: "agent_ops"
  approved_by_admin: false
  references:
    industry_pack_ref: "specs/v1/agent-factory/industry/cleaning-services.md"
    system_prompt_ref: "specs/v1/agent-factory/industry/cleaning-services-system-prompt.v1.md"
    docs_alignment:
      - "https://elevenlabs.io/docs/agents-platform/workflows"
      - "https://elevenlabs.io/docs/agents-platform/tools/server-tools"
      - "https://elevenlabs.io/docs/agents-platform/testing"
      - "https://elevenlabs.io/docs/agents-platform/versioning"

defaults:
  fallback_node: "fallback_general_information"
  escalate_on_low_confidence: true
  low_confidence_threshold: 0.65
  max_hops_before_handoff: 4
  workflow_overrides_supported: true

intents:
  - id: "scope_or_safety_exception"
    description: "scope or safety exception"
    entry_node: "triage_scope_exception"
    fallback_node: "route_service_manager"
    escalation_required: true
  - id: "urgent_deadline_request"
    description: "urgent deadline request"
    entry_node: "triage_urgent_schedule"
    fallback_node: "schedule_priority_service"
    escalation_required: true
  - id: "new_booking_request"
    description: "new booking request"
    entry_node: "cleaning_service_discovery"
    fallback_node: "schedule_standard_service"
    escalation_required: false
  - id: "recurring_plan_interest"
    description: "recurring plan interest"
    entry_node: "recurring_plan_flow"
    fallback_node: "route_plan_sales"
    escalation_required: false
  - id: "move_in_move_out_request"
    description: "move in move out request"
    entry_node: "move_service_flow"
    fallback_node: "schedule_move_service"
    escalation_required: false
  - id: "pricing_or_package_question"
    description: "pricing or package question"
    entry_node: "pricing_package_information"
    fallback_node: "route_service_manager"
    escalation_required: true
  - id: "quality_complaint"
    description: "quality complaint"
    entry_node: "quality_recovery_flow"
    fallback_node: "route_quality_manager"
    escalation_required: true
  - id: "reschedule_or_cancel"
    description: "reschedule or cancel"
    entry_node: "appointment_change_flow"
    fallback_node: "route_dispatch_queue"
    escalation_required: false
  - id: "human_agent_request"
    description: "human agent request"
    entry_node: "human_handoff"
    fallback_node: "fallback_general_information"
    escalation_required: true
  - id: "out_of_scope_request"
    description: "out of scope request"
    entry_node: "out_of_scope_response"
    fallback_node: "fallback_general_information"
    escalation_required: false

nodes:
  - id: "triage_scope_exception"
    type: "triage"
    required_fields:
      - "service_address"
      - "callback_phone"
      - "urgency_level"
      - "issue_summary"
    allowed_tools:
      - "lookup_customer"
    next:
      on_success: "route_service_manager"
      on_failure: "route_service_manager"

  - id: "route_service_manager"
    type: "escalation"
    required_fields:
      - "service_address"
      - "callback_phone"
      - "escalation_reason"
    allowed_tools:
      - "create_task"
    next:
      on_success: "end_call_handoff"
      on_failure: "end_call_handoff"

  - id: "triage_urgent_schedule"
    type: "triage"
    required_fields:
      - "service_address"
      - "callback_phone"
      - "urgency_level"
      - "issue_summary"
    allowed_tools:
      - "lookup_customer"
    next:
      on_success: "schedule_priority_service"
      on_failure: "schedule_priority_service"

  - id: "schedule_priority_service"
    type: "booking"
    required_fields:
      - "service_type"
      - "service_address"
      - "callback_phone"
      - "preferred_time_window"
    allowed_tools:
      - "book_appointment"
      - "create_task"
    next:
      on_success: "end_call_success"
      on_failure: "route_dispatch_queue"

  - id: "cleaning_service_discovery"
    type: "discovery"
    required_fields:
      - "service_type"
      - "service_address"
      - "callback_phone"
      - "issue_summary"
    allowed_tools:
      - "lookup_customer"
    next:
      on_success: "schedule_standard_service"
      on_failure: "schedule_standard_service"

  - id: "schedule_standard_service"
    type: "booking"
    required_fields:
      - "service_type"
      - "service_address"
      - "callback_phone"
      - "preferred_time_window"
    allowed_tools:
      - "book_appointment"
      - "create_task"
    next:
      on_success: "end_call_success"
      on_failure: "route_dispatch_queue"

  - id: "recurring_plan_flow"
    type: "discovery"
    required_fields:
      - "service_type"
      - "service_address"
      - "callback_phone"
      - "issue_summary"
    allowed_tools:
      - "lookup_customer"
    next:
      on_success: "route_plan_sales"
      on_failure: "route_plan_sales"

  - id: "route_plan_sales"
    type: "discovery"
    required_fields:
      - "service_type"
      - "service_address"
      - "callback_phone"
      - "issue_summary"
    allowed_tools:
      - "lookup_customer"
    next:
      on_success: "fallback_general_information"
      on_failure: "fallback_general_information"

  - id: "move_service_flow"
    type: "discovery"
    required_fields:
      - "service_type"
      - "service_address"
      - "callback_phone"
      - "issue_summary"
    allowed_tools:
      - "lookup_customer"
    next:
      on_success: "schedule_move_service"
      on_failure: "schedule_move_service"

  - id: "schedule_move_service"
    type: "booking"
    required_fields:
      - "service_type"
      - "service_address"
      - "callback_phone"
      - "preferred_time_window"
    allowed_tools:
      - "book_appointment"
      - "create_task"
    next:
      on_success: "end_call_success"
      on_failure: "route_dispatch_queue"

  - id: "pricing_package_information"
    type: "information"
    required_fields:
      - "service_type"
      - "service_address"
      - "callback_phone"
      - "issue_summary"
    allowed_tools:
      - "lookup_customer"
    next:
      on_success: "route_service_manager"
      on_failure: "route_service_manager"

  - id: "quality_recovery_flow"
    type: "discovery"
    required_fields:
      - "service_type"
      - "service_address"
      - "callback_phone"
      - "issue_summary"
    allowed_tools:
      - "lookup_customer"
    next:
      on_success: "route_quality_manager"
      on_failure: "route_quality_manager"

  - id: "route_quality_manager"
    type: "discovery"
    required_fields:
      - "service_type"
      - "service_address"
      - "callback_phone"
      - "issue_summary"
    allowed_tools:
      - "lookup_customer"
    next:
      on_success: "fallback_general_information"
      on_failure: "fallback_general_information"

  - id: "appointment_change_flow"
    type: "schedule_change"
    required_fields:
      - "callback_phone"
      - "service_address"
    allowed_tools:
      - "lookup_customer"
      - "create_task"
    next:
      on_success: "route_dispatch_queue"
      on_failure: "route_dispatch_queue"

  - id: "route_dispatch_queue"
    type: "queue"
    required_fields:
      - "escalation_reason"
      - "callback_phone"
    allowed_tools:
      - "create_task"
    next:
      on_success: "end_call_handoff"
      on_failure: "end_call_handoff"

  - id: "human_handoff"
    type: "handoff"
    required_fields:
      - "escalation_reason"
    allowed_tools:
      - "create_task"
    next:
      on_success: "end_call_handoff"
      on_failure: "end_call_handoff"

  - id: "fallback_general_information"
    type: "fallback"
    required_fields: []
    allowed_tools: []
    next:
      on_success: "end_call_no_action"
      on_failure: "fallback_general_information"

  - id: "out_of_scope_response"
    type: "fallback"
    required_fields: []
    allowed_tools: []
    next:
      on_success: "fallback_general_information"
      on_failure: "fallback_general_information"

  - id: "end_call_success"
    type: "terminal"
    required_fields: []
    allowed_tools:
      - "end_call"

  - id: "end_call_handoff"
    type: "terminal"
    required_fields: []
    allowed_tools:
      - "transfer_to_number"

  - id: "end_call_no_action"
    type: "terminal"
    required_fields: []
    allowed_tools:
      - "end_call"

tooling:
  built_in_tools:
    - name: "end_call"
      enabled: true
    - name: "language_detection"
      enabled: true
    - name: "transfer_to_number"
      enabled: false
      enabled_when:
        - "explicit_handoff_policy_permits_transfer"
  server_tools:
    default_approval_mode: "manual"
    default_response_timeout_seconds: 9.5
    max_response_timeout_seconds: 20
    definitions:
      - name: "lookup_customer"
        approval_mode: "auto"
      - name: "book_appointment"
        approval_mode: "manual"
      - name: "create_task"
        approval_mode: "manual"

versioning:
  branches_enabled: true
  protected_branch: "main"
  staging_branch: "staging"
  rollback_via_versions_api: true

tests:
  baseline:
    - id: "cleaning_services.greeting.default"
      expected_node: "fallback_general_information"
    - id: "cleaning_services.intent.scope_or_safety_exception"
      expected_node: "fallback_general_information"
    - id: "cleaning_services.intent.urgent_deadline_request"
      expected_node: "fallback_general_information"
    - id: "cleaning_services.workflow.new_booking"
      expected_node: "fallback_general_information"
    - id: "cleaning_services.workflow.recurring_plan"
      expected_node: "fallback_general_information"
    - id: "cleaning_services.workflow.move_service"
      expected_node: "fallback_general_information"
    - id: "cleaning_services.kb.pricing_packages"
      expected_node: "fallback_general_information"
    - id: "cleaning_services.kb.quality_policy"
      expected_node: "fallback_general_information"
    - id: "cleaning_services.escalation.human_handoff"
      expected_node: "fallback_general_information"
    - id: "cleaning_services.negative.no_false_guarantees"
      expected_node: "fallback_general_information"
    - id: "cleaning_services.negative.no_out_of_scope_commitment"
      expected_node: "fallback_general_information"
    - id: "cleaning_services.post_call.payload_schema"
      expected_node: "fallback_general_information"
  daily_regression_enabled: true
