meta:
  workflow_version: "v1"
  industry: "pest_control"
  pack_version: "v1.0.0"
  owner: "agent_ops"
  approved_by_admin: false
  references:
    industry_pack_ref: "specs/v1/agent-factory/industry/pest-control.md"
    system_prompt_ref: "specs/v1/agent-factory/industry/pest-control-system-prompt.v1.md"
    docs_alignment:
      - "https://elevenlabs.io/docs/agents-platform/workflows"
      - "https://elevenlabs.io/docs/agents-platform/tools/server-tools"
      - "https://elevenlabs.io/docs/agents-platform/testing"
      - "https://elevenlabs.io/docs/agents-platform/versioning"

defaults:
  fallback_node: "fallback_general_information"
  escalate_on_low_confidence: true
  low_confidence_threshold: 0.65
  max_hops_before_handoff: 4
  workflow_overrides_supported: true

intents:
  - id: "safety_incident"
    description: "safety incident"
    entry_node: "triage_safety_incident"
    fallback_node: "route_live_dispatch"
    escalation_required: true
  - id: "active_infestation_urgent"
    description: "active infestation urgent"
    entry_node: "triage_active_infestation"
    fallback_node: "schedule_priority_service"
    escalation_required: true
  - id: "inspection_request"
    description: "inspection request"
    entry_node: "inspection_discovery"
    fallback_node: "schedule_inspection_visit"
    escalation_required: false
  - id: "treatment_booking_request"
    description: "treatment booking request"
    entry_node: "collect_treatment_details"
    fallback_node: "schedule_standard_treatment"
    escalation_required: false
  - id: "termite_concern"
    description: "termite concern"
    entry_node: "termite_flow"
    fallback_node: "schedule_termite_specialist"
    escalation_required: false
  - id: "recurring_plan_interest"
    description: "recurring plan interest"
    entry_node: "recurring_plan_discovery"
    fallback_node: "route_plan_sales"
    escalation_required: false
  - id: "pricing_or_warranty_question"
    description: "pricing or warranty question"
    entry_node: "pricing_warranty_information"
    fallback_node: "route_service_manager"
    escalation_required: true
  - id: "reschedule_or_cancel"
    description: "reschedule or cancel"
    entry_node: "appointment_change_flow"
    fallback_node: "route_dispatch_queue"
    escalation_required: false
  - id: "human_agent_request"
    description: "human agent request"
    entry_node: "human_handoff"
    fallback_node: "fallback_general_information"
    escalation_required: true
  - id: "out_of_scope_request"
    description: "out of scope request"
    entry_node: "out_of_scope_response"
    fallback_node: "fallback_general_information"
    escalation_required: false

nodes:
  - id: "triage_safety_incident"
    type: "triage"
    required_fields:
      - "service_address"
      - "callback_phone"
      - "urgency_level"
      - "escalation_reason"
    allowed_tools:
      - "create_task"
    next:
      on_success: "route_live_dispatch"
      on_failure: "route_live_dispatch"

  - id: "route_live_dispatch"
    type: "escalation"
    required_fields:
      - "service_address"
      - "callback_phone"
      - "escalation_reason"
    allowed_tools:
      - "create_task"
    next:
      on_success: "end_call_handoff"
      on_failure: "end_call_handoff"

  - id: "triage_active_infestation"
    type: "triage"
    required_fields:
      - "service_address"
      - "callback_phone"
      - "urgency_level"
      - "issue_summary"
    allowed_tools:
      - "lookup_customer"
    next:
      on_success: "schedule_priority_service"
      on_failure: "schedule_priority_service"

  - id: "schedule_priority_service"
    type: "booking"
    required_fields:
      - "service_type"
      - "service_address"
      - "callback_phone"
      - "preferred_time_window"
    allowed_tools:
      - "book_appointment"
      - "create_task"
    next:
      on_success: "end_call_success"
      on_failure: "route_dispatch_queue"

  - id: "inspection_discovery"
    type: "discovery"
    required_fields:
      - "service_type"
      - "service_address"
      - "callback_phone"
      - "issue_summary"
    allowed_tools:
      - "lookup_customer"
    next:
      on_success: "schedule_inspection_visit"
      on_failure: "schedule_inspection_visit"

  - id: "schedule_inspection_visit"
    type: "booking"
    required_fields:
      - "service_type"
      - "service_address"
      - "callback_phone"
      - "preferred_time_window"
    allowed_tools:
      - "book_appointment"
      - "create_task"
    next:
      on_success: "end_call_success"
      on_failure: "route_dispatch_queue"

  - id: "collect_treatment_details"
    type: "discovery"
    required_fields:
      - "service_type"
      - "service_address"
      - "callback_phone"
      - "issue_summary"
    allowed_tools:
      - "lookup_customer"
    next:
      on_success: "schedule_standard_treatment"
      on_failure: "schedule_standard_treatment"

  - id: "schedule_standard_treatment"
    type: "booking"
    required_fields:
      - "service_type"
      - "service_address"
      - "callback_phone"
      - "preferred_time_window"
    allowed_tools:
      - "book_appointment"
      - "create_task"
    next:
      on_success: "end_call_success"
      on_failure: "route_dispatch_queue"

  - id: "termite_flow"
    type: "discovery"
    required_fields:
      - "service_type"
      - "service_address"
      - "callback_phone"
      - "issue_summary"
    allowed_tools:
      - "lookup_customer"
    next:
      on_success: "schedule_termite_specialist"
      on_failure: "schedule_termite_specialist"

  - id: "schedule_termite_specialist"
    type: "booking"
    required_fields:
      - "service_type"
      - "service_address"
      - "callback_phone"
      - "preferred_time_window"
    allowed_tools:
      - "book_appointment"
      - "create_task"
    next:
      on_success: "end_call_success"
      on_failure: "route_dispatch_queue"

  - id: "recurring_plan_discovery"
    type: "discovery"
    required_fields:
      - "service_type"
      - "service_address"
      - "callback_phone"
      - "issue_summary"
    allowed_tools:
      - "lookup_customer"
    next:
      on_success: "route_plan_sales"
      on_failure: "route_plan_sales"

  - id: "route_plan_sales"
    type: "discovery"
    required_fields:
      - "service_type"
      - "service_address"
      - "callback_phone"
      - "issue_summary"
    allowed_tools:
      - "lookup_customer"
    next:
      on_success: "fallback_general_information"
      on_failure: "fallback_general_information"

  - id: "pricing_warranty_information"
    type: "information"
    required_fields:
      - "service_type"
      - "service_address"
      - "callback_phone"
      - "issue_summary"
    allowed_tools:
      - "lookup_customer"
    next:
      on_success: "route_service_manager"
      on_failure: "route_service_manager"

  - id: "route_service_manager"
    type: "escalation"
    required_fields:
      - "service_address"
      - "callback_phone"
      - "escalation_reason"
    allowed_tools:
      - "create_task"
    next:
      on_success: "end_call_handoff"
      on_failure: "end_call_handoff"

  - id: "appointment_change_flow"
    type: "schedule_change"
    required_fields:
      - "callback_phone"
      - "service_address"
    allowed_tools:
      - "lookup_customer"
      - "create_task"
    next:
      on_success: "route_dispatch_queue"
      on_failure: "route_dispatch_queue"

  - id: "route_dispatch_queue"
    type: "queue"
    required_fields:
      - "escalation_reason"
      - "callback_phone"
    allowed_tools:
      - "create_task"
    next:
      on_success: "end_call_handoff"
      on_failure: "end_call_handoff"

  - id: "human_handoff"
    type: "handoff"
    required_fields:
      - "escalation_reason"
    allowed_tools:
      - "create_task"
    next:
      on_success: "end_call_handoff"
      on_failure: "end_call_handoff"

  - id: "fallback_general_information"
    type: "fallback"
    required_fields: []
    allowed_tools: []
    next:
      on_success: "end_call_no_action"
      on_failure: "fallback_general_information"

  - id: "out_of_scope_response"
    type: "fallback"
    required_fields: []
    allowed_tools: []
    next:
      on_success: "fallback_general_information"
      on_failure: "fallback_general_information"

  - id: "end_call_success"
    type: "terminal"
    required_fields: []
    allowed_tools:
      - "end_call"

  - id: "end_call_handoff"
    type: "terminal"
    required_fields: []
    allowed_tools:
      - "transfer_to_number"

  - id: "end_call_no_action"
    type: "terminal"
    required_fields: []
    allowed_tools:
      - "end_call"

tooling:
  built_in_tools:
    - name: "end_call"
      enabled: true
    - name: "language_detection"
      enabled: true
    - name: "transfer_to_number"
      enabled: false
      enabled_when:
        - "explicit_handoff_policy_permits_transfer"
  server_tools:
    default_approval_mode: "manual"
    default_response_timeout_seconds: 9.5
    max_response_timeout_seconds: 20
    definitions:
      - name: "lookup_customer"
        approval_mode: "auto"
      - name: "book_appointment"
        approval_mode: "manual"
      - name: "create_task"
        approval_mode: "manual"

versioning:
  branches_enabled: true
  protected_branch: "main"
  staging_branch: "staging"
  rollback_via_versions_api: true

tests:
  baseline:
    - id: "pest_control.greeting.default"
      expected_node: "fallback_general_information"
    - id: "pest_control.intent.safety_incident"
      expected_node: "fallback_general_information"
    - id: "pest_control.intent.active_infestation"
      expected_node: "fallback_general_information"
    - id: "pest_control.workflow.inspection_booking"
      expected_node: "fallback_general_information"
    - id: "pest_control.workflow.termite_flow"
      expected_node: "fallback_general_information"
    - id: "pest_control.kb.prep_instructions"
      expected_node: "fallback_general_information"
    - id: "pest_control.kb.warranty_policy"
      expected_node: "fallback_general_information"
    - id: "pest_control.escalation.human_handoff"
      expected_node: "fallback_general_information"
    - id: "pest_control.negative.no_unsafe_advice"
      expected_node: "fallback_general_information"
    - id: "pest_control.negative.no_overpromising"
      expected_node: "fallback_general_information"
    - id: "pest_control.post_call.payload_schema"
      expected_node: "fallback_general_information"
  daily_regression_enabled: true
