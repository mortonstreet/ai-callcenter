meta:
  profile_version: "v1"
  profile_name: "<industry_slug>-core-tabs-v1"
  owner: "platform_admin"
  approved_by_admin: false

governance:
  owner_editable_fields:
    - "conversation_config.agent.first_message"
    - "conversation_config.tts.voice_id"
    - "conversation_config.tts.stability"
    - "conversation_config.tts.similarity_boost"
    - "conversation_config.tts.speed"
  owner_blocked_tabs:
    - "Workflow"
    - "Branches"
    - "Knowledge Base"
    - "Analysis"
    - "Tools"
    - "Tests"
    - "Widget"
    - "Security"
    - "Advanced"

tabs:
  agent:
    locked_fields:
      - "conversation_config.agent.prompt.prompt"
      - "conversation_config.agent.prompt.llm"
      - "conversation_config.agent.prompt.temperature"
      - "conversation_config.agent.prompt.max_tokens"
      - "conversation_config.agent.language"
    owner_fields:
      - "conversation_config.agent.first_message"
      - "conversation_config.tts.voice_id"
      - "conversation_config.tts.stability"
      - "conversation_config.tts.similarity_boost"
      - "conversation_config.tts.speed"
    defaults:
      llm: "gpt-4o"
      temperature: 0.7
      max_tokens: 1024
      language: "en"
      voice:
        stability_range: [0.55, 0.85]
        similarity_boost_range: [0.65, 0.9]
        speed_range: [0.95, 1.08]

  workflow:
    admin_locked: true
    definition_ref: "<industry_workflow_yaml_path>"
    fallback_behavior: "fallback_general_information"
    max_branch_depth: 4

  branches:
    admin_locked: true
    intent_to_branch_ref: "<industry_pack_intent_map>"
    escalate_on_low_confidence: true
    low_confidence_threshold: 0.65

  knowledge_base:
    admin_locked: true
    firecrawl:
      enabled: true
      source_domain: "<customer_domain>"
      include_paths: ["<set_by_industry_policy>"]
      exclude_paths: ["/privacy", "/terms", "/careers", "/wp-admin"]
      max_pages: 200
    ingest:
      strategy: "urls"
      allow_owner_manual_additions: false

  analysis:
    admin_locked: true
    data_collection_schema_ref: "<industry_pack_data_collection>"
    evaluation_criteria_ref: "<industry_pack_evaluation_criteria>"
    thresholds_locked: true

  tools:
    admin_locked: true
    system_tools:
      - name: "end_call"
        enabled: true
      - name: "transfer_to_number"
        enabled: false
      - name: "language_detection"
        enabled: true
    mcp:
      enabled: true
      endpoint: "https://api.revcenter.ai/mcp/sse"
      approval_policy: "auto_for_safe_tools"
    webhook_tools:
      allow_owner_custom_webhooks: false

  tests:
    admin_locked: true
    baseline_suite_ref: "<industry_pack_baseline_tests>"
    block_activation_on_failures: true
    schedule:
      development: "on_change"
      daily: "0 6 * * *"

  widget:
    admin_locked: true
    enabled: false
    allowed_domains: []
    branding_locked: true

  security:
    admin_locked: true
    auth_token_enabled: true
    allowed_origins:
      - "https://app.revcenter.ai"
    webhook_signing_required: true
    secret_rotation_days: 90

  advanced:
    admin_locked: true
    call_limits:
      max_concurrent: 10
      daily_cap: 1000
    conversation:
      max_duration_seconds: 3600
      silence_end_call_timeout: 30
      turn_timeout: 10
      text_only_mode: false
    privacy:
      recording_retention: "90"
    webhooks:
      post_call_url: "https://api.revcenter.ai/webhooks/elevenlabs/post-call"
      events:
        - "call.ended"
        - "transcript.ready"

