meta:
  workflow_version: "v1"
  industry: "<industry_slug>"
  pack_version: "v1.0.0"
  owner: "agent_ops"
  approved_by_admin: false

defaults:
  fallback_node: "fallback_general_information"
  escalate_on_low_confidence: true
  low_confidence_threshold: 0.65
  max_hops_before_handoff: 4

intents:
  - id: "safety_emergency"
    description: "<life_or_safety_emergency_intent>"
    entry_node: "triage_safety_emergency"
    fallback_node: "route_live_dispatch"
    escalation_required: true
  - id: "urgent_service_request"
    description: "<urgent_non_safety_request>"
    entry_node: "triage_urgent_service"
    fallback_node: "schedule_priority_service"
    escalation_required: true
  - id: "routine_booking_request"
    description: "<standard_booking_request>"
    entry_node: "collect_service_intake"
    fallback_node: "schedule_standard_service"
    escalation_required: false
  - id: "pricing_or_quote_request"
    description: "<pricing_or_estimate_request>"
    entry_node: "pricing_quote_information"
    fallback_node: "route_estimate_queue"
    escalation_required: false
  - id: "reschedule_or_cancel"
    description: "<appointment_change_request>"
    entry_node: "appointment_change_flow"
    fallback_node: "route_dispatch_queue"
    escalation_required: false
  - id: "warranty_or_dispute"
    description: "<warranty_or_dispute_request>"
    entry_node: "warranty_dispute_flow"
    fallback_node: "route_service_manager"
    escalation_required: true
  - id: "human_agent_request"
    description: "<explicit_human_request>"
    entry_node: "human_handoff"
    fallback_node: "human_handoff"
    escalation_required: true
  - id: "out_of_scope_request"
    description: "<unsupported_request>"
    entry_node: "out_of_scope_response"
    fallback_node: "fallback_general_information"
    escalation_required: false

nodes:
  - id: "triage_safety_emergency"
    type: "triage"
    required_fields:
      - "service_address"
      - "callback_phone"
      - "urgency_level"
      - "escalation_reason"
    allowed_tools: []
    next:
      on_success: "route_live_dispatch"
      on_failure: "route_live_dispatch"
  - id: "triage_urgent_service"
    type: "triage"
    required_fields:
      - "service_address"
      - "callback_phone"
      - "urgency_level"
      - "issue_summary"
    allowed_tools:
      - "lookup_customer"
    next:
      on_success: "schedule_priority_service"
      on_failure: "route_dispatch_queue"
  - id: "collect_service_intake"
    type: "discovery"
    required_fields:
      - "service_type"
      - "service_address"
      - "callback_phone"
      - "issue_summary"
    allowed_tools:
      - "lookup_customer"
    next:
      on_success: "schedule_standard_service"
      on_failure: "fallback_general_information"
  - id: "schedule_priority_service"
    type: "booking"
    required_fields:
      - "service_type"
      - "service_address"
      - "preferred_time_window"
    allowed_tools:
      - "book_appointment"
      - "create_task"
    next:
      on_success: "end_call_success"
      on_failure: "route_dispatch_queue"
  - id: "schedule_standard_service"
    type: "booking"
    required_fields:
      - "service_type"
      - "service_address"
      - "preferred_time_window"
    allowed_tools:
      - "book_appointment"
      - "create_task"
    next:
      on_success: "end_call_success"
      on_failure: "route_dispatch_queue"
  - id: "pricing_quote_information"
    type: "information"
    required_fields:
      - "service_type"
    allowed_tools:
      - "lookup_customer"
    next:
      on_success: "route_estimate_queue"
      on_failure: "route_service_manager"
  - id: "appointment_change_flow"
    type: "schedule_change"
    required_fields:
      - "callback_phone"
    allowed_tools:
      - "lookup_customer"
      - "create_task"
    next:
      on_success: "end_call_success"
      on_failure: "route_dispatch_queue"
  - id: "warranty_dispute_flow"
    type: "escalation"
    required_fields:
      - "service_address"
      - "callback_phone"
      - "escalation_reason"
    allowed_tools:
      - "lookup_customer"
      - "create_task"
    next:
      on_success: "route_service_manager"
      on_failure: "route_service_manager"
  - id: "human_handoff"
    type: "handoff"
    required_fields:
      - "escalation_reason"
    allowed_tools:
      - "create_task"
    next:
      on_success: "end_call_handoff"
      on_failure: "end_call_handoff"
  - id: "out_of_scope_response"
    type: "fallback"
    required_fields: []
    allowed_tools: []
    next:
      on_success: "end_call_no_action"
      on_failure: "fallback_general_information"
  - id: "fallback_general_information"
    type: "fallback"
    required_fields: []
    allowed_tools: []
    next:
      on_success: "end_call_no_action"
      on_failure: "route_service_manager"
  - id: "route_live_dispatch"
    type: "escalation"
    required_fields:
      - "escalation_reason"
    allowed_tools:
      - "create_task"
    next:
      on_success: "end_call_handoff"
      on_failure: "end_call_handoff"
  - id: "route_dispatch_queue"
    type: "queue"
    required_fields:
      - "escalation_reason"
    allowed_tools:
      - "create_task"
    next:
      on_success: "end_call_handoff"
      on_failure: "end_call_handoff"
  - id: "route_estimate_queue"
    type: "queue"
    required_fields:
      - "service_type"
      - "callback_phone"
    allowed_tools:
      - "create_task"
    next:
      on_success: "end_call_success"
      on_failure: "route_service_manager"
  - id: "route_service_manager"
    type: "escalation"
    required_fields:
      - "escalation_reason"
    allowed_tools:
      - "create_task"
    next:
      on_success: "end_call_handoff"
      on_failure: "end_call_handoff"
  - id: "end_call_success"
    type: "terminal"
    required_fields: []
    allowed_tools: []
  - id: "end_call_handoff"
    type: "terminal"
    required_fields: []
    allowed_tools: []
  - id: "end_call_no_action"
    type: "terminal"
    required_fields: []
    allowed_tools: []

